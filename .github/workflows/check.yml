name: check

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gate (tsc + eslint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The same command developers run before every commit. Keeping CI and
      # the local gate literally identical is the point — a gate that only
      # exists in CI gets discovered after the fact.
      - run: bun run check

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: polymetis
          POSTGRES_PASSWORD: polymetis
          POSTGRES_DB: polymetis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polymetis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://polymetis:polymetis@localhost:5432/polymetis
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Applying against a real Postgres catches a migration that generates
      # but does not apply — a failure mode that unit tests cannot see, and
      # that is expensive to discover on a deploy.
      - run: bun run db:migrate
      # DB-dependent PASS/FAIL checks: the properties Postgres has to enforce
      # and unit tests cannot see (uniqueness backstop, reconnect cursor,
      # concurrent appenders). sandbox-isolation.ts skips here (no image, no
      # network) — the sandbox job below is its authority.
      - run: bun run verify

  sandbox:
    name: sandbox isolation holds
    runs-on: ubuntu-latest
    env:
      # sandbox-isolation.ts and sandbox-setup.ts import @/env, which requires
      # a DATABASE_URL. Neither connects — a well-formed URL is enough, so no
      # Postgres service.
      DATABASE_URL: postgres://polymetis:polymetis@localhost:5432/polymetis
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The tag tracks the agent SDK version pinned in package.json; it is the
      # SANDBOX_IMAGE default in src/env.ts, and a mismatch fails at run time.
      - run: docker build -f docker/sandbox.Dockerfile -t polymetis/sandbox:0.3.222 .
      - run: bun run sandbox:setup
      # The rules sandbox:setup prints, applied verbatim (ADR-0005): DROP all
      # egress from the sandbox bridge, then insert the proxy-port ACCEPT above
      # it. The verification below is what decides whether they work.
      - run: |
          sudo iptables -I DOCKER-USER -i polymetis0 -j DROP
          sudo iptables -I DOCKER-USER -i polymetis0 -d "$(docker network inspect polymetis-sandbox \
            --format '{{(index .IPAM.Config 0).Gateway}}')" \
            -p tcp --dport 7777 -j ACCEPT
      # The proxy-reachability probe needs a listener where the worker's proxy
      # would be. Background processes survive across steps in a job.
      - run: bun -e 'Bun.listen({ hostname: "0.0.0.0", port: 7777, socket: { data() {} } })' &
      # The script exits 0 on SKIP by design (a laptop without Docker must not
      # go red). In this job a skip is a broken job, not a pass, so the PASS
      # line is asserted explicitly.
      - run: |
          set -o pipefail
          bun run scripts/verify/sandbox-isolation.ts 2>&1 | tee isolation.log
          grep -q "sandbox-isolation: PASS" isolation.log
